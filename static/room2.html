<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 2: Isolation</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #111; color: #fff; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 0 10px; cursor: pointer; background-color: #333; color: white; border: 1px solid #555; }
    </style>
</head>
<body>
    <h1>Room 2: Isolation</h1>
    <p>A void evoking loneliness and unease.</p>

    <div class="controls">
        <button id="end-btn" onclick="window.location.href='/room3'">End & Proceed to Room 3</button>
    </div>

    <script>
        const clientId = "client_" + Math.random().toString(36).substring(7);
        const ws = new WebSocket(`ws://${window.location.host}/ws/room2/${clientId}`);

        ws.onopen = function() {
            console.log("Connected to Room 2 WebSocket");
        };

        ws.onmessage = function(event) {
            console.log("Received data:", event.data);
        };
    </script>
</body>
</html>
